name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test ./... -race -count=1
  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - run: ./build.sh all
      - uses: actions/upload-artifact@v4
        with:
          name: mtrad-binarios
          path: dist/
